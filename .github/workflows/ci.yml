name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: swift --version
      - name: swift-format
        run: swift format lint --strict --recursive Sources Tests scripts Package.swift

  test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build --only-use-versions-from-resolved-file
      - name: Test
        run: swift test --only-use-versions-from-resolved-file
      - name: Build app bundle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build_app.sh
      - name: Verify signature
        run: codesign --verify --deep --strict build/WacomViewportLock.app
      - name: Zip app
        # ditto keeps the bundle's permissions and signature intact (upload-artifact would not).
        run: ditto -c -k --keepParent build/WacomViewportLock.app WacomViewportLock.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WacomViewportLock-${{ github.sha }}
          path: WacomViewportLock.zip
          retention-days: 14
